<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You...</title>
    <style>
        /* Reset and Premium Romantic Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            /* Ultra-romantic rich berry and soft rose moving gradient */
            background: linear-gradient(-45deg, #1a0006, #4a1525, #ff4d6d, #800f2f);
            background-size: 400% 400%;
            animation: romanticGradient 12s ease infinite;
            font-family: 'Quicksand', 'Georgia', serif;
            overflow: hidden;
            position: relative;
        }

        @keyframes romanticGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* FLOATING ROMANTIC HUB CONTAINER */
        .love-card {
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 40px 25px;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45),
                        inset 0 1px 2px rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            max-width: 90%;
            width: 400px;
            z-index: 10;
            animation: cardEntrance 1.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: scale(0.8) translateY(40px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* PULSING LOVE HEADLINE */
        h1 {
            color: #ffffff;
            font-size: 2.6rem;
            margin-bottom: 15px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(255, 77, 109, 0.6);
            animation: pulseGlow 2.5s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); text-shadow: 0 0 15px rgba(255, 77, 109, 0.6); }
            100% { transform: scale(1.04); text-shadow: 0 0 30px rgba(255, 77, 109, 0.9), 0 0 10px #fff; }
        }

        /* 🛠️ OVERSIZED GIF PORTAL FIXED FRAME */
        .gif-portal-frame {
            margin: 20px auto;
            width: 230px;  
            height: 230px; 
            background: #ffffff; /* Gives solid backing to mask transparent bugs */
            border-radius: 50%;  
            overflow: hidden;
            box-shadow: 0 0 35px rgba(255, 77, 109, 0.8);
            animation: portalFloat 4s ease-in-out infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Strict internal container boundary downscale */
        .gif-portal-frame img {
            width: 85%;
            height: 85%;
            object-fit: contain;
            display: block;
        }

        @keyframes portalFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); box-shadow: 0 0 30px rgba(255, 77, 109, 0.6); }
            50% { transform: translateY(-12px) rotate(2deg); box-shadow: 0 0 45px rgba(255, 77, 109, 0.9), 0 0 20px #fff; }
        }

        /* ROMANTIC PARAGRAPH SUBTEXT */
        p {
            color: #ffe5ec;
            font-size: 1.15rem;
            line-height: 1.6;
            margin-top: 15px;
            margin-bottom: 30px;
            font-weight: 400;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.3);
        }

        /* GLOWING ANIMATED NEXT BUTTON */
        .next-love-btn {
            display: inline-block;
            text-decoration: none;
            background: linear-gradient(135deg, #ff4d6d 0%, #ff758f 100%);
            color: #ffffff;
            padding: 14px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(255, 77, 109, 0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border: none;
            letter-spacing: 1px;
            -webkit-tap-highlight-color: transparent;
        }

        .next-love-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 12px 30px rgba(255, 77, 109, 0.7);
            background: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%);
        }

        .next-love-btn:active {
            transform: translateY(-1px) scale(0.97);
        }

        /* FLOATING HEARTS STYLE ENGINE */
        .ambient-heart {
            position: absolute;
            bottom: -100px;
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="hearts-stream-box"></div>

    <div class="love-card">
        <h1>For u..❤️ <br>
            ⬇️</h1>
        
        <div class="gif-portal-frame">
            <img src="tenor (1).gif" alt="Deep Romantic Animation Core">
        </div>

        <p>I like u..✨</p>
        
        <a href="end.htm" class="next-love-btn">Click to End ✨</a>
    </div>

    <script>
        const streamBox = document.getElementById('hearts-stream-box');
        const heartTextures = ['❤️', '💖', '💝', '💕', '✨', '🌸'];

        function deployAmbientHeart() {
            const heartNode = document.createElement('div');
            heartNode.classList.add('ambient-heart');
            
            // Random configurations for maximum cinematic depth
            heartNode.innerText = heartTextures[Math.floor(Math.random() * heartTextures.length)];
            heartNode.style.left = Math.random() * 100 + 'vw';
            
            const sizeValue = Math.random() * 22 + 14; 
            heartNode.style.fontSize = sizeValue + 'px';
            
            // Varied depth opacities
            heartNode.style.opacity = Math.random() * 0.5 + 0.3;
            
            const liveDuration = Math.random() * 6 + 6; 
            
            // Custom high-end bezier curve floating transition
            heartNode.style.transition = `transform ${liveDuration}s linear, opacity ${liveDuration}s ease-out`;
            heartNode.style.transform = `translateY(0) translateX(0) rotate(0deg)`;
            
            streamBox.appendChild(heartNode);

            // Execute float mechanics instantly via frames
            requestAnimationFrame(() => {
                setTimeout(() => {
                    const driftX = (Math.random() * 160) - 80;
                    heartNode.style.transform = `translateY(-115vh) translateX(${driftX}px) rotate(${Math.random() * 360}deg)`;
                    heartNode.style.opacity = '0';
                }, 50);
            });

            // Garbage cleaner loops
            setTimeout(() => {
                heartNode.remove();
            }, liveDuration * 1000);
        }

        // Spawns smoothly every 350ms
        setInterval(deployAmbientHeart, 350);
    </script>
</body>
</html>
