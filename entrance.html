<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Something Special </title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* Cute Aesthetic Pastel Cream/Pink Gradient Background */
    body {
      background: linear-gradient(135deg, #fdf6ec 0%, #fff0f2 100%);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Quicksand', 'Nunito', 'Segoe UI', sans-serif;
    }

    /* MOBILE WRAPPER - Perfect for all Mobile screens */
    .mobile-container {
      position: relative;
      width: 100%;
      max-width: 412px; 
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    /* Soft Pink/Peach Aura Behind the Card */
    .center-glow {
      position: absolute;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(255, 147, 165, 0.35) 0%, rgba(255, 218, 185, 0.15) 50%, rgba(0,0,0,0) 70%);
      top: 22%;
      z-index: 1;
      pointer-events: none;
    }

    /* ---- FLOATING HEARTS & SPARKLES ---- */
    .particle {
      position: absolute;
      z-index: 2;
      opacity: 0;
      animation: floatUp 4.5s infinite ease-in-out;
    }
    
    .heart-p { background-color: #ff758f; width: 10px; height: 10px; }
    .heart-p::before, .heart-p::after {
      content: ""; position: absolute; background-color: #ff758f; border-radius: 50%; width: 10px; height: 10px;
    }
    .heart-p::before { top: -5px; left: 0; }
    .heart-p::after { left: -5px; top: 0; }

    .star-p {
      width: 8px; height: 8px;
      background-color: #ffd166;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      box-shadow: 0 0 8px #ffd166;
    }

    .p1 { top: 28%; left: 15%; animation-delay: 0s; transform: rotate(-15deg); }
    .p2 { top: 42%; left: 10%; animation-delay: 1.2s; }
    .p3 { top: 22%; left: 78%; animation-delay: 2.2s; transform: rotate(20deg); }
    .p4 { top: 35%; left: 85%; animation-delay: 0.6s; }
    .p5 { top: 52%; left: 74%; animation-delay: 3.2s; transform: rotate(-10deg); }
    .p6 { top: 48%; left: 20%; animation-delay: 1.8s; }

    @keyframes floatUp {
      0% { transform: translateY(20px) scale(0.6); opacity: 0; }
      50% { opacity: 0.9; }
      100% { transform: translateY(-50px) scale(1.1); opacity: 0; }
    }

    /* ---- POLAROID FRAME ---- */
    .gif-container {
      position: relative;
      z-index: 3;
      width: 170px;  
      height: 170px; 
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff; 
      border-radius: 28px;
      box-shadow: 0 15px 35px rgba(255, 154, 172, 0.25), 
                  0 5px 15px rgba(0, 0, 0, 0.02);
      border: 5px solid #fff3f5;
      padding: 10px;
      box-sizing: border-box;
      animation: smoothBounce 3s infinite ease-in-out;
    }

    .gif-container img {
      width: 100%;
      height: auto;
      border-radius: 18px;
      display: block;
    }

    @keyframes smoothBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }

    /* ---- LOADING TEXT CONTAINER ---- */
    .loading-ui-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 80px; /* Fixed height container to prevent layout jumping */
      margin-top: 25px;
      justify-content: center;
      animation: elementFadeOut 0.5s forwards;
      animation-delay: 4s; /* Hides completely when loading finishes */
    }

    .loading-text {
      position: relative;
      z-index: 4;
      color: #ff5c7c;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-align: center;
      margin-bottom: 16px;
      text-shadow: 0 2px 5px rgba(255, 117, 143, 0.15);
    }

    /* ---- LOADER BAR CONTAINER ---- */
    .loader-bar-container {
      position: relative;
      z-index: 4;
      width: 160px;
      height: 8px;
      background-color: #fff0f2;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 117, 143, 0.1);
      box-sizing: border-box;
    }

    .loader-progress {
      height: 100%;
      width: 0%; 
      background: linear-gradient(90deg, #ff758f 0%, #ff9a9e 100%);
      border-radius: 20px;
      box-shadow: 0 0 8px rgba(255, 117, 143, 0.5);
      animation: fillProgressOnce 4s forwards cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fillProgressOnce {
      0% { width: 0%; }
      30% { width: 45%; }
      70% { width: 85%; }
      100% { width: 100%; }
    }

    @keyframes elementFadeOut {
      100% { opacity: 0; visibility: hidden; pointer-events: none; display: none; }
    }

    /* ---- SEXY HIGH-END ACTION BUTTON ---- */
    .sexy-btn {
      position: absolute; /* Keeps placement super clean after loader hides */
      bottom: 22%;
      z-index: 5;
      background: linear-gradient(135deg, #ff5c7c 0%, #ff758f 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 15px 36px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 92, 124, 0.45), 
                  inset 0 2px 4px rgba(255, 255, 255, 0.3);
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(20px) scale(0.9);
      pointer-events: none;
      display: block;
      
      /* Smooth pop animation combined with sexy glow pulse */
      animation: revealButton 0.6s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation-delay: 4.2s; 
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    @keyframes revealButton {
      100% { 
        opacity: 1; 
        transform: translateY(0) scale(1); 
        pointer-events: auto;
        animation: sexyPulse 2s infinite ease-in-out;
      }
    }

    @keyframes sexyPulse {
      0%, 100% { box-shadow: 0 10px 25px rgba(255, 92, 124, 0.45), 0 0 0 0 rgba(255, 92, 124, 0.4); transform: scale(1); }
      50% { box-shadow: 0 15px 35px rgba(255, 92, 124, 0.6), 0 0 0 10px rgba(255, 92, 124, 0); transform: scale(1.04); }
    }

    /* Premium interactive tap feedback for phone screens */
    .sexy-btn:active {
      transform: scale(0.96);
      background: linear-gradient(135deg, #e04664 0%, #ff5c7c 100%);
      box-shadow: 0 5px 15px rgba(255, 92, 124, 0.4);
    }
  </style>
</head>

<body>

  <div class="mobile-container">

    <div class="center-glow"></div>

    <div class="particle heart-p p1"></div>
    <div class="particle star-p p2"></div>
    <div class="particle heart-p p3"></div>
    <div class="particle star-p p4"></div>
    <div class="particle heart-p p5"></div>
    <div class="particle star-p p6"></div>

    <div class="gif-container">
      <img src="tenor (2).gif" alt="Peach Goma Hugging">
    </div>

    <div class="loading-ui-wrapper">
      <div class="loading-text">Loading something special For My Dear...</div>
      <div class="loader-bar-container">
        <div class="loader-progress"></div>
      </div>
    </div>

    <button class="sexy-btn" onclick="window.location.href='2nd.htm'">
      Enter Please this is only for u..→
    </button>
    
  </div>

  <script src="script.js"></script>

</body>
</html>
